name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Type-check, test and build on the Node versions the tooling runs on.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The generated types match the specs
        if: matrix.node == 24
        run: |
          npm run generate
          git diff --exit-code -- src/generated
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: dist
          path: dist

  # The built package on every Node the SDK supports, including 18 and 20.
  runtime:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node test/smoke.mjs
